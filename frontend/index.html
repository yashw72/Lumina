<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239333EA' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z'/><path d='M6 6h10'/><path d='M6 10h10'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DocuMentor AI — RAG Learning Assistant</title>
    <meta name="description" content="Grounded AI study assistant with RAG: chat with documents, verified page-level source citations, summaries, 3D flashcards, and quizzes." />

    <!-- Prevent theme flash before React mounts -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('documentor.theme');
          var supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (!theme && supportDarkMode)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-lilac-50 dark:bg-ink text-ink dark:text-slate-100 antialiased min-h-screen selection:bg-lilac-200 dark:selection:bg-lilac-900 selection:text-ink dark:selection:text-white">
    <!-- Skip to content accessible navigation -->
    <a
      href="#main-content"
      class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-ink focus:text-white focus:rounded-full focus:font-bold focus:shadow-2xl"
    >
      Skip to main content
    </a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
